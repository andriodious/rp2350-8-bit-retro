# Tagged releases verify source builds; publishing uses the hardware-verified UF2.
# Never delete or replace a release automatically with an untested rebuild.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Rust target for the 1581 core
        run: rustup target add thumbv8m.main-none-eabi
      - uses: actions/cache@v5
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/setup.sh', 'third_party/c64-sources.json', 'third_party/frank-c64-presto.patch') }}
      - name: Fetch SDK, ROMs and BBC Elite
        run: scripts/setup.sh --no-build --roms
      - name: Build four-machine release configuration
        run: |
          . deps/env.sh
          EXTRA_OS_CMAKE_ARGS="-DBOOT_STATUS_TRIAL=ON" scripts/build-experimental-four.sh build-release
          python3 tests/bluetooth/firmware_test.py build-release "$(command -v arm-none-eabi-nm)"
      - uses: actions/upload-artifact@v6
        with:
          name: four-machine-source-rebuild
          path: build-release/rp2350-8-bit-retro-presto.uf2
